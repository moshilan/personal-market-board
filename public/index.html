<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="个人与家人日常查看的金价、白银和广东油价" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>日常行情</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div class="title-group">
          <h1 id="page-title" tabindex="-1">日常行情</h1>
          <p class="kicker" id="page-kicker" hidden></p>
        </div>
        <p class="collection-status" id="collection-status" aria-live="polite" hidden></p>
        <button class="display-refresh" type="button" aria-label="刷新显示">刷新显示</button>
      </header>
      <p class="reading-note" id="reading-note" aria-live="polite" hidden>正在读取本地展示数据</p>
      <div id="app" aria-busy="true">
        <section class="loading-placeholder" aria-hidden="true">
          <div></div><div></div><div></div>
        </section>
      </div>
    </main>
    <nav class="bottom-nav" aria-label="一级导航">
      <button type="button" data-view="home" aria-current="page"><span aria-hidden="true">⌂</span>首页</button>
      <button type="button" data-view="gold"><span aria-hidden="true">○</span>金价</button>
      <button type="button" data-view="silver"><span aria-hidden="true">◇</span>白银</button>
      <button type="button" data-view="fuel"><span aria-hidden="true">◈</span>油价</button>
    </nav>
    <script type="module" src="./app.js"></script>
  </body>
</html>
